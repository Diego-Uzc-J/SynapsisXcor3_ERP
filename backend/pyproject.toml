[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "synapsisx-erp-backend"
version = "0.1.0"
description = "API del ERP modular: FastAPI + SQLAlchemy 2.x + Alembic"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "itsdangerous>=2.2",
    "psycopg[binary]>=3.2",
    "pwdlib[argon2]>=0.2",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "PyJWT[crypto]>=2.9",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.22",
    "httpx>=0.27",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
